name: Deploy Typst Course Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Checkout
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # Install Typst
      # ========================================================

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      # ========================================================
      # Install Open Graph image tools
      #
      # Asymptote is used to generate the OG-image artwork.
      # ImageMagick is used for PNG processing/resizing.
      # ========================================================

      - name: Install Asymptote and ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y asymptote imagemagick

      # ========================================================
      # Verify external build tools
      # ========================================================

      - name: Verify build tools
        run: |
          typst --version
          asy --version
          magick --version

      # ========================================================
      # Build website
      # ========================================================

      - name: Build website
        run: |
          chmod +x build.sh
          ./build.sh

      # ========================================================
      # Optional: Upload diagnostics
      # ========================================================

      # - name: Upload link report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: link-report
      #     path: diagnostics/link_report.txt

      # ========================================================
      # Verify build output
      # ========================================================

      - name: Verify build output
        run: |
          find dist

          test -f dist/index.html
          test -d dist/pages
          test -d dist/pdf
          test -d dist/assets

          test -f dist/assets/css/style.css

      # ========================================================
      # Verify Open Graph images
      #
      # At least the generated OG directory should exist.
      # Individual images may be supplied by source assets or
      # generated by scripts/og/.
      # ========================================================

      - name: Verify Open Graph images
        run: |
          test -d dist/assets/og

          echo "Open Graph images:"
          find dist/assets/og -type f -name "*.png" -print

      # ========================================================
      # Deploy to GitHub Pages
      # ========================================================

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true