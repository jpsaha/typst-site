name: Deploy Typst Course Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Install Typst to handle your .typ compiling tasks
      - name: Install Typst Compiler
        uses: typst-community/setup-typst@v5

      # 2. FIXED: Setup Node.js environment to allow "npx pagefind" to index content
      # - name: Setup Node Runtime Environment
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: '20'

      # 3. Run the automated script which will now successfully execute pagefind
      - name: Run Compilation Pipeline Script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Setup GitHub Pages Deployment Environment
        uses: actions/configure-pages@v4

      - name: Upload Static Web Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
