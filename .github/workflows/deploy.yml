name: Deploy Typst Course Website

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # FIX: Adding this explicit environment block tells GitHub to output the deployment card and URL link
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Typst Compiler
        uses: typst-community/setup-typst@v5

      - name: Run Compilation Pipeline Script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Setup GitHub Pages Deployment Environment
        uses: actions/configure-pages@v4

      - name: Upload Static Web Assets Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
